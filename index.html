<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f32"><title>Jardinería y Desbroces FOSKY</title>
<style>
:root{--g:#216747;--d:#173f32;--bg:#f2f6f1;--line:#e0e9e1}*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:var(--bg);color:#203329}.layout{display:flex;min-height:100vh}.side{width:230px;background:var(--d);color:white;padding:22px 14px}.brand{font-weight:800;font-size:17px;padding:8px 10px 24px}.brand span{display:block;color:#cce7a7;font-size:13px}.nav button{display:block;width:100%;text-align:left;border:0;background:none;color:#e0eee4;padding:12px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:#2b5945}.main{flex:1;min-width:0}.top{background:white;padding:18px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.content{padding:24px;max-width:1300px;margin:auto}.btn{background:var(--g);color:white;border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.btn.light{background:#e6f0e8;color:var(--d)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}.muted{color:#718077}.big{font-size:25px;font-weight:750;margin-top:8px}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:13px;color:#68776d}.field input,.field select,.field textarea{padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;font:inherit}.modal{display:none;position:fixed;inset:0;background:#10251bb8;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.dialog{background:white;padding:22px;border-radius:14px;width:min(560px,100%);max-height:90vh;overflow:auto}.actions{display:flex;justify-content:flex-end;gap:8px}.empty{padding:22px;text-align:center;color:#718077;background:#f7faf6;border-radius:9px}@media(max-width:760px){.layout{display:block}.side{width:100%;padding:10px}.brand{padding:5px 8px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.content{padding:14px}.top{padding:14px}.big{font-size:21px}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">🌿 JARDINERÍA Y DESBROCES<span>FOSKY</span></div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><strong id="heading">Inicio</strong><button class="btn" id="new">＋ Nuevo trabajo</button></header><section class="content" id="app"></section></main></div><div class="modal" id="modal"><form class="dialog" id="form"><h3 id="formTitle">Nuevo registro</h3><div id="fields"></div><div class="actions"><button type="button" class="btn light" id="cancel">Cancelar</button><button class="btn">Guardar</button></div></form></div>
<script>
const config={trabajos:['cliente','fecha','tipo','direccion','importe','estado','horas','notas'],clientes:['nombre','telefono','email','direccion','notas'],mantenimientos:['cliente','tarea','frecuencia','fecha','importe','estado'],facturas:['cliente','numero','fecha','concepto','importe','estado'],gastos:['concepto','categoria','fecha','importe','tipo','proveedor'],maquinaria:['equipo','marca','coste','mantenimiento','notas'],recordatorios:['titulo','fecha','hora','prioridad','estado']};
const labels={inicio:'Inicio',trabajos:'Trabajos',clientes:'Clientes',calendario:'Calendario',mantenimientos:'Mantenimientos',facturas:'Facturas y cobros',gastos:'Gastos',maquinaria:'Maquinaria',recordatorios:'Recordatorios',informes:'Informes'};
let db=JSON.parse(localStorage.getItem('fosky-v1')||'{}');Object.keys(config).forEach(k=>db[k]??=[]);let page='inicio',edit=null;
const $=s=>document.querySelector(s),eur=n=>(Number(n)||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'}),today=new Date().toISOString().slice(0,10);
function persist(){localStorage.setItem('fosky-v1',JSON.stringify(db))}
$('#nav').innerHTML=Object.keys(labels).map(k=>'<button data-page="'+k+'">'+labels[k]+'</button>').join('');
$('#nav').onclick=e=>{let b=e.target.closest('button');if(b)show(b.dataset.page)};
function show(p){page=p;$('#heading').textContent=labels[p];$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#new').style.display=config[p]?'block':'none';let el=$('#app');
if(p==='inicio'){let inc=db.trabajos.filter(x=>x.estado==='Cobrado'||x.cobrado==='Sí').reduce((s,x)=>s+ +x.importe,0)+db.facturas.filter(x=>x.estado==='Cobrado').reduce((s,x)=>s+ +x.importe,0),out=db.gastos.reduce((s,x)=>s+ +x.importe,0);el.innerHTML='<h2>Bienvenido a FOSKY 🌱</h2><p class="muted">Organiza tus trabajos de jardinería y desbroces.</p><div class="stats"><div class="card"><span class="muted">Ingresos cobrados</span><div class="big">'+eur(inc)+'</div></div><div class="card"><span class="muted">Gastos</span><div class="big">'+eur(out)+'</div></div><div class="card"><span class="muted">Beneficio provisional</span><div class="big">'+eur(inc-out)+'</div></div><div class="card"><span class="muted">Trabajos registrados</span><div class="big">'+db.trabajos.length+'</div></div></div><div class="grid"><div class="card"><h3>Trabajos próximos</h3>'+list('trabajos')+'</div><div class="card"><h3>Accesos rápidos</h3><button class="btn light" onclick="openForm(\'clientes\')">＋ Cliente</button> <button class="btn light" onclick="openForm(\'gastos\')">＋ Gasto</button> <button class="btn light" onclick="openForm(\'recordatorios\')">＋ Recordatorio</button></div></div>';return}
if(config[p]){el.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h2>'+labels[p]+'</h2><button class="btn" onclick="openForm(\''+p+'\')">＋ Añadir</button></div><div class="card tablewrap">'+table(p)+'</div>';return}
if(p==='calendario'){el.innerHTML='<h2>Calendario de trabajos</h2><div class="card">'+(db.trabajos.length?table('trabajos'):'<div class="empty">Añade trabajos con fecha para verlos aquí.</div>')+'</div>';return}
if(p==='informes'){let total=k=>db[k].reduce((s,x)=>s+ +(x.importe||0),0);el.innerHTML='<h2>Resumen económico</h2><div class="stats"><div class="card">Trabajos<div class="big">'+db.trabajos.length+'</div></div><div class="card">Facturas<div class="big">'+eur(total('facturas'))+'</div></div><div class="card">Gastos<div class="big">'+eur(total('gastos'))+'</div></div><div class="card">Mantenimientos<div class="big">'+db.mantenimientos.length+'</div></div></div><button class="btn" onclick="exportData()">Exportar CSV</button>'}
}
function list(k){return db[k].slice(-5).reverse().map(x=>'<p><b>'+esc(x.cliente||x.nombre||x.titulo||'Trabajo')+'</b> · '+esc(x.fecha||'Sin fecha')+'</p>').join('')||'<div class="empty">Aún no hay trabajos registrados.</div>'}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function table(k){let rows=db[k];return rows.length?'<table><thead><tr>'+config[k].slice(0,6).map(x=>'<th>'+x+'</th>').join('')+'<th></th></tr></thead><tbody>'+rows.map((r,i)=>'<tr>'+config[k].slice(0,6).map(x=>'<td>'+esc(r[x]||'—')+'</td>').join('')+'<td><button class="btn light" onclick="openForm(\''+k+'\','+i+')">Editar</button> <button class="btn light" onclick="del(\''+k+'\','+i+')">Borrar</button></td></tr>').join('')+'</tbody></table>':'<div class="empty">Todavía no hay registros. Pulsa Añadir para empezar.</div>'}
function openForm(k,i=null){edit=i;let fields=config[k];$('#formTitle').textContent=(i===null?'Añadir ':'Editar ')+labels[k].toLowerCase();$('#fields').innerHTML=fields.map(f=>'<div class="field"><label>'+f[0].replaceAll('_',' ')+'</label><input name="'+f+'" '+(f==='fecha'||f==='mantenimiento'?'type="date"':f==='importe'||f==='horas'||f==='coste'?'type="number" step="0.01"':f==='email'?'type="email"':'type="text"')+' value="'+esc(i===null?(f==='fecha'?today:''):db[k][i][f]||'')+'"></div>').join('');$('#form').dataset.kind=k;$('#modal').classList.add('show')}
$('#form').onsubmit=e=>{e.preventDefault();let k=e.target.dataset.kind,obj=Object.fromEntries(new FormData(e.target));if(edit===null)db[k].push(obj);else db[k][edit]=obj;persist();$('#modal').classList.remove('show');show(page)};
function del(k,i){if(confirm('¿Borrar este registro?')){db[k].splice(i,1);persist();show(page)}}
$('#new').onclick=()=>openForm('trabajos');$('#cancel').onclick=()=>$('#modal').classList.remove('show');function exportData(){let lines=['modulo;datos'];Object.entries(db).forEach(([k,arr])=>arr.forEach(x=>lines.push(k+';'+Object.entries(x).map(([a,b])=>a+': '+b).join(' | '))));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv'}));a.download='fosky.csv';a.click()}
show('inicio');
</script></body></html>
